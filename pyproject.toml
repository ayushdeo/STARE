[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stare"
version = "0.0.1"
description = "Closed-loop region acquisition for spatial transcriptomics"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

# Install editable on the 4070:  pip install -e .
